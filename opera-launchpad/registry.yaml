            GDAL requires native libraries (brew install gdal on macOS).
          pip_install: ["tabulate", "geopandas"]
          post_setup:
            - "touch ../../../report/__init__.py ../../../report/opera_validator/__init__.py && venv/bin/pip install -e ../../.."
            - "export GDAL_CONFIG=$(command -v gdal-config || find /opt/homebrew/Cellar/gdal -name gdal-config -not -path '*/bash_completion.d/*' 2>/dev/null | head -1) && export PATH=$(dirname $GDAL_CONFIG):$PATH && venv/bin/pip install GDAL==$($GDAL_CONFIG --version)"
        entrypoint: "venv/bin/python cmr_audit_disp_s1.py"
        params:
          - name: start_datetime
            flag: "--start-datetime"
            type: datetime_iso
            required: true
            help: "ISO datetime with timezone"
          - name: end_datetime
            flag: "--end-datetime"
            type: datetime_iso
            required: true
            help: "ISO datetime with timezone"
