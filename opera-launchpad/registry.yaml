            flag: "-s"
            type: datetime_iso
            required: false
            help: "ISO datetime after which data is retrieved"
          - name: end_date
            flag: "-e"
            type: datetime_iso
            required: false
            help: "ISO datetime before which data is retrieved"
          - name: venue
            flag: "--venue"
            type: choice
            choices: ["PROD"]
