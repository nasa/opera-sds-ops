            type: path
            is_output: true
          - name: format
            flag: "--format"
            type: choice
            choices: ["txt", "json"]
            default: "txt"
          - name: log_level
            flag: "--log-level"
            type: choice
            choices: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
