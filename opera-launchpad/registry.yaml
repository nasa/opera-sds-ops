            flag: "--frame-to-burst-db"
            type: path
            required: true
            help: "Path to opera-s1-disp-frame-to-burst.json"
          - name: filter_north_america
            flag: "--filter-is-north-america"
            # BooleanOptionalAction: false has to be spelled out as
            # --no-filter-is-north-america, not just an omitted flag.
            type: bool_optional
            default: true
            help: "Filter to North America frames only"
