          - name: full_report
            flag: "--full-report"
            type: bool
            default: false
            help: "Include 1-to-1 HLS to OPERA mappings in the report"

      audit:
        kind: single
        repo: "https://github.com/nasa/opera-sds-pcm.git"
        branch: "develop"
        path: "tools/ops/cmr_audit"
        setup: "python3 -m venv venv && venv/bin/pip install -e '../../..[cmr_audit]'"
        verify: "venv/bin/python cmr_audit_hls.py --help"
        overrides:
          reason: >
            All cmr_audit scripts use absolute imports from the opera-sds-pcm
            package. Full PCM install with [cmr_audit] extras required.
        entrypoint: "venv/bin/python cmr_audit_hls.py"
        params:
          - name: start_datetime
            flag: "--start-datetime"
            type: datetime_iso
            required: true
            help: "ISO datetime with timezone, e.g. 2026-01-01T00:00:00+00:00"
          - name: end_datetime
            flag: "--end-datetime"
            type: datetime_iso
            required: true
            help: "ISO datetime with timezone (script requires this despite defaulting it internally)"
          - name: output
            flag: "-o"
            type: path
            is_output: true
          - name: format
            flag: "--format"
            type: choice
            choices: ["txt", "json"]
            default: "txt"
          - name: log_level
            flag: "--log-level"
            type: choice
            choices: ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]
            default: "INFO"

  RTC_S1:
    display_name: "Radiometric Terrain Corrected - Sentinel-1"
    tools:
      duplicates:
        kind: single
        repo: "https://github.com/nasa/opera-sds-ops.git"
        branch: "main"
        path: "duplicates"
        setup: "python3 -m venv venv && venv/bin/pip install -r requirements.txt"
        verify: "venv/bin/python duplicate_check.py --help"
        entrypoint: "venv/bin/python duplicate_check.py"
        fixed_args: ["RTC_S1"]
        params:
          - name: start_date
            flag: "-s"
            type: datetime_iso
            required: false
            help: "ISO datetime after which data is retrieved"
          - name: end_date
            flag: "-e"
            type: datetime_iso
            required: false
            help: "ISO datetime before which data is retrieved"
          - name: venue
            flag: "--venue"
            type: choice
            choices: ["PROD", "UAT"]
            default: "PROD"
          - name: output
            flag: "-o"
            type: path
            default: "duplicate_report.json"
            is_output: true
          - name: facet
            flag: "--facet"
            type: choice
            choices: ["months", "dates", "both"]
            default: "months"
          - name: use_revision
            flag: "--use-revision"
            type: bool
            default: false
            help: "Use revision date range instead of temporal range"

      audit:
        kind: single
        repo: "https://github.com/nasa/opera-sds-pcm.git"
        branch: "develop"
        path: "tools/ops/cmr_audit"
        setup: "python3 -m venv venv && venv/bin/pip install -e '../../..[cmr_audit]'"
        verify: "venv/bin/python cmr_audit_burst_coverage.py --help"
        overrides:
          reason: >
            All cmr_audit scripts use absolute imports from the opera-sds-pcm
            package. Full PCM install with [cmr_audit] extras required.
            Shapely needed for GeoJSON polygon intersection filtering.
          pip_install: ["shapely"]
        # Burst-ID derivation downloads SLC annotation metadata using an EDL
        # Bearer token from ~/.netrc; without it, that step silently fails
        # per-SLC (logs a warning, contributes an empty burst list) instead
        # of erroring outright, so results end up degraded rather than
        # bad-request-failing. `./setup.sh` prompts for EDL credentials once.
        requires_edl: true
        entrypoint: "venv/bin/python cmr_audit_burst_coverage.py"
        # --do-rtc/--do-cslc are value-taking ("true"/"false"), not store_true
        # flags, so a bare "--do-rtc" (no value) is a hard argparse error.
        fixed_args: ["--do-rtc", "true"]
        params:
          - name: start_datetime
            flag: "--start-datetime"
            type: datetime_iso
            required: true
            help: "ISO datetime with timezone"
          - name: end_datetime
            flag: "--end-datetime"
            type: datetime_iso
            required: true
            help: "ISO datetime with timezone"
          - name: geojson
            flag: "-g"
            type: path
            required: true
            help: "Path or URL to GeoJSON file defining region of interest"
          - name: do_cslc
            flag: "--do-cslc"
            type: choice
            choices: ["false", "true"]
            default: "false"
            help: "Also check CSLC-S1 coverage"
          - name: output
            flag: "-o"
            type: path
            is_output: true
          - name: format
            flag: "--format"
            type: choice
            choices: ["json", "txt"]
            default: "json"
          - name: log_level
            flag: "--log-level"
            type: choice
            choices: ["DEBUG", "INFO", "WARNING", "ERROR"]
            default: "INFO"

